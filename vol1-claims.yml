  - id: FL.VIII
    type: foundational_law
    title: "The Desire-for-God Law"
    core_text: >
      The human heart, made for God, generates a longing for him as a
      structural feature of its design (Eccl. 3:11). This longing precedes
      the participant's awareness of its true Object, survives every
      substitutional attempt to fill it with something else, and operates as
      the inward signal that the participant was created for communion with
      God in Christ. The longing's recognition and orientation toward its
      true Object is a developmental movement. Operationally: the
      participant who attends to her longing and orients it toward its true
      Object finds the other Foundational Laws doing their proper work; the
      participant whose longing has been suppressed, substituted, or numbed
      finds the same laws functionally inert.
    status: core
    confidence: 90
    confidence_rationale: >
      Multi-author scriptural support is extremely strong (nine authors
      across both Testaments). Remaining uncertainty is principally on the
