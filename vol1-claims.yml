  - id: FL.X
    type: foundational_law
    title: "The Ask-Seek-Knock Law"
    core_text: >
      Persistent, faith-filled asking in alignment with God's character
      produces receiving; asking from wrong motive (James 4:3) does not. The
      law is the threshold form of the prayer mechanism: the gate that must
      be crossed before the proportional dynamics of the Prayer Resonance
      Law (V1.Exp8) come into play. It operates at the vertical scale.
    status: core
    confidence: 90
