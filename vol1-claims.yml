      - Eccl. 2:1-11
      - Jer. 2:13
      - Rom. 1:21-25
      - John 4:13-14
      - Phil. 3:7-8
      - Isa. 55:1-2
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1, FL.III, FL.VIII]
