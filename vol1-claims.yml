  - id: FL.III
    type: foundational_law
    title: "The Heart-Throne Law"
    core_text: >
      Whatever the heart looks to as its primary source of security,
      meaning, or identity functions as its functional throne-holder. When
      Christ is enthroned in that central place, the heart is reordered, and
      the dysfunctions sourced from competing thrones unwind; when something
      other than Christ is enthroned, anxious dependence, distorted desire,
      and moral-relational dysfunction follow. The mechanism is bidirectional
      and explicit in scripture: Christ-enthronement → flourishing of the
      heart (Col. 3:1-4); idolatry → dysfunction (Rom. 1:21-25). The law sits
      at Period 1 / Group II (Heart) with a B (Both) directionality tag —
      primarily vertical in its Person↔God dimension, with strong horizontal
      expression in the created persons and things that compete for the
      throne. It is the structural pair of the Confession-Restoration Law:
      confession clears the sin act; the Heart-Throne Law dethrones the
      idol the sin was serving.
    status: core
    confidence: 90
    confidence_rationale: >
      As high as the Confession-Restoration Law. Remaining uncertainty is
      principally on the operational secondary question of how the
      dethroning actually happens.
