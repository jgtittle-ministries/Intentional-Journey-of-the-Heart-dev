  - id: FL.XV
    type: foundational_law
    title: "The Hardening Law"
    core_text: >
      Sustained refusal of God-ward orientation progressively reduces the
      heart's responsiveness to truth, eventually closing the channel; the
      closure is incremental, cumulative, and reaches a point past which
      external intervention is required because the internal capacity to
      receive has been impaired (Heb. 3:7-15; Prov. 29:1). The dynamic is
      asymmetric in time — reduction follows from sustained refusal, while
      restoration requires external intervention or a punctuating event
      that breaks the trajectory — and operates without conscious
      recognition by the participant in the middle of it ("the deceitfulness
      of sin," Heb. 3:13). Scripture names both human-agency (the
      participant's self-hardening) and divine-agency (the Lord's hardening
      or giving-up) features of the dynamic. Scale-invariant: operates at
      the individual, community, and arguably generational scales.
    status: core
    confidence: 90
    confidence_rationale: >
      Multi-author scriptural support is strong (five biblical authors
      across both Testaments, multiple genres). Broad acceptance is
      uncontested across mainstream Christian traditions on the dynamic
      itself.
