  - id: FL.XXXVII
    type: foundational_law
    title: "The Worship Alignment Law"
    core_text: >
      Sustained worship of a worshiped Object recalibrates the worshiper's
      perception of reality, affection, and conduct toward the worshiped
      Object's nature, with the recalibration occurring progressively
      through the worship's sustained operation over time and through
      embodied participation rather than through cognitive assent alone; the
      directional correctness of the recalibration depends on whether the
      worshiped Object is the One Who Is — in which case the recalibration
      produces progressive conformity to Christ in perception, affection,
      and conduct — or any of the substitute Objects the heart may worship
      instead — in which case the recalibration produces progressive
      conformity to the substitute's structural emptiness. Scale-invariant.
    status: core
    confidence: 90
    confidence_rationale: >
      Six-or-more-biblical-author cross-Testament support (the Psalmist
      across two parallel passages; Paul in Romans and 2 Corinthians;
      Hosea; the Kings narrator; Isaiah; Jeremiah).
