  - id: FL.XVII
    type: foundational_law
    title: "The Substitution-Cascade Law"
    core_text: >
      Household idolatry transmits across generations through the
      implicit-learning channel of family culture, in such a way that what
      one generation enthrones becomes the default the next generation
      absorbs as part of the family's operating reality. The transmission
      operates asymmetrically with respect to its inverse (FL.XXI Household
      Formation): the God-ward transmission requires deliberate teaching,
      sustained modeling, and explicit naming, while the idol-ward
      transmission operates by implicit-learning default. The cascade
      compounds across generations under normal conditions and is broken by
      external intervention — the reformer's tearing-down, the prophet's
      specific address, the conscious dethroning of the inherited pattern
      in a particular household — rather than by natural exhaustion.
      Constitutive bidirectional pair with FL.XXI at P4/GII.
    status: core
    confidence: 85
    confidence_rationale: >
      Clearly Taught at the operational level; Reasonably Inferred at the
      substrate level. Multi-author scriptural support is strong (four
      biblical authors across both Testaments).
    scripture_refs:
      - Exod. 20:5-6
      - Judges 2:10-13
      - 1 Kings 11:1-8
      - 1 Kings 12:25-33
      - Jer. 9:13-14
      - Jer. 16:11
      - Ezek. 20:18
      - 2 Tim. 1:5
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1, FL.I, FL.III, FL.XIV]
    downstream_dependents: [FL.XXI]
    pt_period: P4
    pt_group: GII
    directionality: H
