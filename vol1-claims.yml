  - id: FL.XI
    type: foundational_law
    title: "The Renewal-of-Mind Transformation Law"
    core_text: >
      Sustained renewal of the mind through engagement with God's truth
      produces transformation of the whole person; sustained conformity to
      the pattern of the surrounding age produces deformation by the same
      mechanism pointed at a different source. The mechanism is the
      cumulative effect of ongoing attention to truth, not the result of
      episodic insight. The law operates at the vertical scale (the truth
      and the Spirit being the agents to which the mind is opened) and is
      the high-confidence individual-scale anchor for the same dynamic the
      speculative Attention Economy of the Soul describes at cosmic scale.
    status: core
    confidence: 90
    confidence_rationale: >
      As high as any law in this volume. The Rom. 12:2 statement of both
      directions in a single sentence and the 2 Cor. 3:18 present-continuous
      'being transformed' together give the law unusual structural clarity.
    scripture_refs:
