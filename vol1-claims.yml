  - id: FL.VI
    type: foundational_law
    title: "The Hear-and-Obey Blessing Law"
    core_text: >
      Hearing the word of God and doing it produces blessedness and
      flourishing of the form proper to the unit operating in the law;
      hearing without doing forfeits the blessing. The law is scale-invariant
      (Period 0): it operates identically at the individual, household,
      congregational, national, and generational scales. Its output is
      flourishing rather than further revelation, which distinguishes it
      from the sibling Obedience Channel Law (V1.Exp6) without contradicting
      it.
    status: core
