      Malachi; Matthew and Mark; Paul across multiple letters; Hebrews
      writer; Peter; wisdom writers; Song of Songs poet; Hosea writer; John
      in Revelation) with operational depth across creation, prophetic,
      gospel, apostolic, wisdom, narrative, and apocalyptic registers.
