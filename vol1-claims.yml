  - id: FL.XII
    type: foundational_law
    title: "The Honor-Authority Flourishing Law"
    core_text: >
      Honor of rightly-ordered authority — parental in the originating
      context, generalized to civil and ecclesial authority by the witness
      of Paul and Peter — produces flourishing of the honorer, with
      characteristic time delay; dishonor produces the inverse by the same
      mechanism. The law has an explicit promise structure (Exod. 20:12;
      named as such in Eph. 6:2) and operates at multiple scales: parent-
      child dyad, civic structure, and generational reach via the long-life
      clause.
    status: core
    confidence: 85
    confidence_rationale: >
      The structural strength is high: explicit promise, multi-author
      confirmation, scale generalization. Remaining uncertainty is in the
      secondary question of how 'rightly-ordered' is to be discerned in
