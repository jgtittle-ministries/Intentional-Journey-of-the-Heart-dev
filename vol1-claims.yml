  - id: FL.XIV
    type: foundational_law
    title: "The Vanity-of-Substitutes Law"
    core_text: >
      Every substitutional attempt to fill the FL.VIII Desire-for-God
      longing with an Object other than God fails to produce the
      satisfaction it promises, and the failure is structural to the
      substitutional attempt — not contingent on which substitute is chosen
      (Eccl. 2:1-11), not remediable by intensifying the pursuit, and not
      surprised by a better substitute waiting to be found. The substitute
      satisfies briefly and the thirst returns (John 4:13); the genuine
      Object satisfies and deepens (John 4:14). The failure of one
      substitute naturally recruits the pursuit of the next (Rom. 1:21-25
      exchange cascade) rather than naturally producing reorientation
      toward the original Object; reorientation toward God requires
      revelation, sustained recognition of the cascade's structural nature,
      or both. The inward signature of substitutional pursuit — satisfaction
      that promises and does not deliver — is itself the law's diagnostic
      signal to the participant.
    status: core
    confidence: 90
    confidence_rationale: >
      Multi-author scriptural support is strong (four biblical authors
      across both Testaments, multiple genres). Broad acceptance is
      uncontested across mainstream Christian traditions.
    scripture_refs:
