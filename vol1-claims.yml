  - id: FL.XXXIV
    type: foundational_law
    title: "The Marriage Covenant Architecture Law"
    core_text: >
      The marriage covenant — instituted at creation, ratified by Jesus's
      teaching, articulated by Paul as reflecting the Christ-and-Church
      relationship — operates as the architectural framework conditioning
      the operations within the marital dyad; the framework's scripturally-
      specified operational pathway is the leave-and-cleave-and-one-flesh
      pattern (Gen. 2:24 ratified by Matt. 19:5 and Eph. 5:31), with the
      operational features of covenant-monogamy between man and woman,
      exclusivity at the conjugal level, structural durability through
      divine joining-together, openness to procreation and the household
      formation operations, and eschatological reflective dimension
      grounding the dyadic-architectural arrangement in the
      Christ-and-Church cosmic-eschatological reality.
    status: core
    confidence: 90
