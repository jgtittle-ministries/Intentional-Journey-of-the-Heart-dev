  - id: FL.XXII
    type: foundational_law
    title: "The Endurance-Hope Law"
    core_text: >
      Sustained endurance through trial, when the participant's orientation
      is sustained-God-ward through the trial and the participant remains in
      the trust-and-receive posture toward the trial as formation material,
      produces character that is itself the foundation of hope; the
      trajectory operates as a causal sequence in which each stage is
      causally prior to the next — suffering produces endurance, endurance
      produces character, character produces hope — and the hope produced
      does not put the participant to shame because its ground is the soul's
      history with God under the trial just survived rather than the soul's
      own resources.
    status: core
    confidence: 90
