  - id: FL.XXXVI
    type: foundational_law
    title: "The Eschatological Glory Law"
    core_text: >
      The eschatological completion — God's glory fully revealed, the people
      of God seeing Christ as He is, the new heavens and new earth
      established, the marriage supper of the Lamb celebrated, the dwelling
      of God with men consummated — operates as the forward direction of
      pursuit toward which the heart of the people of God is drawn through
      the present life; the heart's sustained anticipation of the
      not-yet-completed glory produces operational consequences in the
      present life (sustained hope through trial; sacrificial choices in
      service of what is coming; purifying-of-self in anticipation of seeing
      Him as He is; orientation toward "things above" rather than "things
      on the earth"); the absence of eschatological anticipation produces
      present-life over-investment in what is passing away.
    status: core
    confidence: 90
    confidence_rationale: >
      Four-or-more-New-Testament-author support (Paul across seven letters;
      the Hebrews writer; John in 1 John and Revelation; Peter in 1 and 2
