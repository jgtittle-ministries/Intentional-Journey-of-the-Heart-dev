      faces of the generational transmission dynamic. Ex. 20:5-6's
      third-and-fourth-generation iniquity and thousand-generation
      steadfast-love clauses name both directions in a single passage.

  - id: FL.XVIII
    type: foundational_law
    title: "The Bitter-Root Community Law"
    core_text: >
      Unresolved offense between community members, held over time without
      the reconciliation work, calcifies into a root of bitterness that
      spreads through the relational life of the community and defiles many
      (Heb. 12:14-15). The metastasis from a private offense to a
      community-defiling root is the natural trajectory of refused
      reconciliation; the Matt. 18:15-20 pathway is the prescribed corrective
      that interrupts the trajectory at each of its escalation points
      (private address, witnessed address, gathered-body address). The
      defilement operates by the same amplification mechanism V2.Exp9
      Community Amplification names in its general form, here specialized
      for offense and forgiveness. The law is time-sensitive in the manner
      of Eph. 4:26-27 — early intervention is cheap; late intervention at
