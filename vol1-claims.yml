  - id: FL.IX
    type: foundational_law
    title: "The Generosity-Provision Law"
    core_text: >
      Generous giving — of money, time, mercy, attention, anything a person
      can give — evokes provision toward the giver, in varied forms, at the
      scale and shape proper to the situation, with characteristic time
      delay. Withholding evokes the inverse. The law is a domain
      specialization of the Sowing-and-Reaping Law (FL.I) applied to the
      substrate of material and relational generosity, and inherits
      Sowing-and-Reaping's scale-invariance and bidirectional structure.
    status: core
