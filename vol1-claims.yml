# ===========================================================================
# IJH Volume 1 — Claim Registry
# ---------------------------------------------------------------------------
# This file is the authoritative machine-readable record of Volume 1's claims
# for the Intentional Journey of the Heart project. Schema and conventions
# are documented in Volume 6 (Governance Model, Part 1, §2-§3) and in the
# accompanying SCHEMA.md (to be drafted as an early Council priority).
#
# Scope of this file:
#   - Four Foundational Principles (axioms, V1.Ax1-Ax4)
#   - Opening Exploration (V1.OE — The Miracle Frame)
#   - Eight Numbered Explorations (V1.Exp1-Exp8)
#   - Supplemental Exploration (V1.Sup1)
#   - Thirty-Eight Foundational Laws (FL.I-FL.XXXVIII)
#   - One preserved minority position (V1.Exp3.Mn1)
#
# Conventions:
#   - IDs: V{volume}.{type}{number} for axioms, OE, explorations, supplemental,
#     minorities; FL.{Roman numeral} for Foundational Laws
#   - status: core | minority | open
#   - confidence: integer 0-100 mapping to the qualitative tier:
#       Clearly Taught     → 85-95 (default 85)
#       Reasonably Inferred → 65-80 (default 75)
#       Speculative         → 30-55 (default 40)
#       Axioms              → 90 (working-axiom tier)
#   - pt_period / pt_group: Periodic Table cell placement per Vol 5 PT chapter
#       pt_period ∈ {P0, P1, P2, P3, P4, P5}
#       pt_group  ∈ {GI, GII, GIII, GIV, GV, GVI}
#   - directionality: V (Vertical Person↔God) | H (Horizontal Person↔Person) |
#     B (Both V and H) | I (Intra-personal)
#   - band: 1 (Band 1, principle on multi-author scriptural footing) |
#           2 (Band 2, principle + scripturally-specified operational pathway) |
#           3 (Band 3, principle with tradition-arbitrated operational form) |
#           null (not band-tagged)
#   - mirror_type: statement (idol-ward face named explicitly) |
#                  constitutive (the law's content is itself the orientation) |
#                  constitutive_bidirectional (both faces in one structure) |
#                  orientation_neutral (mechanism does not carry orientation)
#   - gateway: true when designated as a structural-threshold Gateway entry
#   - Dependencies are expressed as ID lists; tooling validates them as a DAG.
# ===========================================================================

project: IJH
volume: 1
schema_version: 0.2
founder: John G. Tittle
last_council_review: null    # Council not yet seated; founder-stewarded
source_documents:
  - IJH_Vol1_v5_6_1_1.docx
  - docs/volume-1-laws-of-the-spirit/foundational-law-*.md (38 chapters)
  - docs/volume-5-references/periodic-table-of-spiritual-laws-a-summing.md

# Schema change log:
#   v0.2 (2026-05-23) — Added pt_period, pt_group, directionality, band,
#         mirror_type, mirror_text, gateway fields capturing the matured
#         catalog's Periodic Table structural metadata. Added 38 Foundational
#         Law entries (FL.I-FL.XXXVIII) drawn from the matured Vol 1
#         Foundational Law tier. Total claims: 15 prior + 38 FL = 53.
#   v0.1 (initial)  — Demonstration encoding of the 15 V1.Ax/OE/Exp/Sup/Mn
#         entries sourced from IJH_Vol1_v5_4_1.docx as proof of schema fit.

claims:

# ===========================================================================
# Four Foundational Principles (Axioms, held at ~90%)
# ===========================================================================

  - id: V1.Ax1
    type: axiom
    title: "Laws of the Spirit Exist"
    core_text: >
      The spiritual world operates according to regular, predictable, lawful
      relationships — as orderly as the physical world — because the same God
      created both.
    status: core
    confidence: 90
    confidence_rationale: >
      Held as working axiom. Grounded in Jesus' rebuke of Nicodemus (John 3)
      — a teacher of Israel was expected to understand how the Spirit works —
      and in the theological conviction that created reality reflects the
      rational character of its Creator.
    scripture_refs:
      - John 3:1-12
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: []
    downstream_dependents: [V1.All, V2.All, V3.All, V4.All]
    flip_conditions: >
      Would require demonstrating that spiritual phenomena are fundamentally
      irregular or lawless. Some apophatic mystical traditions approach this
      but stop short of asserting it; the axiom is named precisely to keep
      that assertion outside the project's premises.

  - id: V1.Ax2
    type: axiom
    title: "These Laws Are Knowable"
    core_text: >
      We will not see all the laws, but we should be able to see more than we
      do today. The wind blows where it wishes, but we should be able to see
      more than just the sound of it passing — we should be carried by it.
    status: core
    confidence: 90
    scripture_refs:
      - John 3:8
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1]   # knowability presupposes existence
    downstream_dependents: [V1.All, V2.All, V3.All, V4.All]
    flip_conditions: >
      Would require demonstrating that the laws, though real, are in principle
      inaccessible to human investigation. This is a stronger negative claim
      than the axiom's positive one and requires independent argument.

  - id: V1.Ax3
    type: axiom
    title: "Knowable in All Three Worlds"
    core_text: >
      The laws are knowable simultaneously in spirit, in mind and emotions,
      and in body and actions. If I have truly grasped a law of the Spirit,
      my doing will change. If I am not changed by God's word, I have not yet
      heard God's word.
    status: core
    confidence: 90
    scripture_refs:
      - James 1:22-25
      - Matthew 7:24-27
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.Ax2]
    downstream_dependents:
      - V1.Exp1   # feedback loop depends on embodied response
      - V2.All
      - Formation.HFT
      - Formation.SST
      - Formation.MSFIG

  - id: V1.Ax4
    type: axiom
    title: "We Can Operate in These Laws"
    core_text: >
      The goal is not intellectual mapping but lived alignment. Miracles are
      not meant to be the exception but the expected fruit of operating in
      alignment with how God's world and kingdom actually work.
    status: core
    confidence: 90
    scripture_refs:
      - John 14:12
      - Mark 16:17-18
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.Ax2, V1.Ax3]
    downstream_dependents: [V1.OE, V1.All, V2.All, V3.All, V4.All]
    notes: >
      This axiom is the load-bearing warrant for the whole project's urgency.
      The Opening Exploration (V1.OE) is its immediate downstream expression.

# ===========================================================================
# Opening Exploration: The Miracle Frame
# (Periodic Table cell: P0/GI — relocated from P5/GI under scale-invariance)
# ===========================================================================

  - id: V1.OE
    type: opening_exploration
    title: "The Miracle Frame — The Natural World as a Subset"
    core_text: >
      The natural world is a proper subset of God's larger spiritual reality.
      Miracles are not violations of natural law — they are instances of a
      higher-order law operating on the natural world from a superset of
      dimensions. The closer a person operates in alignment with the
      higher-order laws, the more the natural world yields to them.
    status: core
    confidence: 75
    confidence_rationale: >
      The conceptual framework is strong and scripturally grounded. The
      precise mathematical structure of the higher-order laws is the open
      trail ahead.
    author_note: >
      "This is the load-bearing premise of the entire investigation. If I
      can't establish it, everything else I am doing is just interesting
      theology."
    scripture_refs:
      - Hebrews 11:3
      - Colossians 1:15-17
      - 2 Kings 6:15-17
    external_sources:
      - "C.S. Lewis, Miracles (self-defeating naturalism argument)"
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.Ax2, V1.Ax4]
    downstream_dependents: [V1.All, V2.All, V3.All, V4.All]
    pt_period: P0
    pt_group: GI
    directionality: V
    band: null
    mirror_type: orientation_neutral
    mirror_text: >
      The Miracle Frame's architectural character does not carry orientation;
      the architectural relationship of the spiritual to the natural is
      structural rather than orientation-shaped.
    notes: >
      Relocated from P5/GI to P0/GI under the scale-invariance criterion: the
      spiritual-permeates-natural relationship operates at all scales by the
      same mechanism. Absorbed the Vol 3 TFT Structural Law forward-reference.
    flip_conditions: >
      A successful defense of ontological naturalism would collapse the
      project's urgency claim even if the axioms held in some reduced form.

# ===========================================================================
# Eight Numbered Explorations
# ===========================================================================

  - id: V1.Exp1
    type: operational_law
    title: "How to Get Faith (Word → Hearing → Faith)"
    core_text: >
      Faith (trust, pistis) is generated by hearing the Word of Christ with
      a genuine willingness to obey. The quality of hearing is modulated by
      prior obedience. Obedience keeps the channel open and reinforces the
      loop; disobedience degrades the channel and initiates a hardening
      process.
    status: core
    confidence: 75
    confidence_rationale: >
      Strong scriptural grounding. The specific mechanism linking
      willingness-to-obey with the logos-to-rhema conversion is experientially
      confirmed but not yet directly anchored in a single ESV text. Community
      testing needed.
    scripture_refs:
      - Romans 10:17
      - "Parable of the Sower (Matt 13, Mark 4, Luke 8)"
    external_sources:
      - "Wayne Grudem, Systematic Theology (rhema/logos caution)"
      - "Dmitri Bilgere (transformation as 'risking belief')"
    traditions_supporting: [Reformed, Evangelical, Charismatic]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.Ax3, V1.OE]
    downstream_dependents:
      - V1.Exp6
      - V2.Exp1
      - V2.All
      - V3.Eq1
      - Formation.HFT
    pt_period: P1
    pt_group: GII
    directionality: V
    band: null
    mirror_type: statement
    mirror_text: >
      The same chain operates wherever sustained attention to a source
      produces faith in what the source says. Hearing chains directed toward
      false gospels produce faith in falsehood (2 Tim. 4:3-4).
    notes: >
      Also operates at the community scale (P3/GII) through corporate
      scriptural reception; cross-referenced with V2.Exp9 Community
      Amplification and FL.XXXI Corporate Scriptural Reception Law.
    flip_conditions: >
      If the willingness-to-obey mechanism were demonstrated to be
      epiphenomenal rather than causal, the entire Vol 2 therapeutic
      structure would need reconsideration.
    open_questions:
      - "Precise mechanism converting logos to rhema remains experiential rather than textually anchored"

  - id: V1.Exp2
    type: structural_law
    title: "My Spirit, Heart, Soul, and Body (Nested Person Structure)"
    core_text: >
      The components of a person form a nested containment structure: spirit
      (innermost) is a subset of my heart, while the heart, mind, and body
      are subsets/components of the soul. Each outer layer contains and is
      influenced by all inner layers. Transformation that does not reach the
      innermost layer is surface change.
    status: core
    confidence: 75
    confidence_rationale: >
      Overall structure is well-grounded; the precise relationship between
      heart, mind, and soul remains an open question requiring more work.
    scripture_refs:
      - Mark 12:29-30
      - 1 Thessalonians 5:23
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: [Reformed-Dichotomist]
    upstream_dependencies: [V1.Ax1, V1.Ax3]
    downstream_dependents:
      - V2.Exp1
      - V2.SinBlockage
      - V3.Eq1
    pt_period: P1
    pt_group: GVI
    directionality: I
    band: null
    mirror_type: orientation_neutral
    mirror_text: >
      The Nested Person Structure is architectural rather than
      orientation-shaped.
    flip_conditions: >
      If scripture were shown to use 'heart' and 'soul' interchangeably in a
      way that dissolves the nesting, the structural claim would weaken
      significantly. Grudem and others argue dichotomy (body/soul) rather
      than richer nesting; this is the strongest live challenge.
    open_questions:
      - "Precise boundary between heart and mind"
      - "Whether the structure is strictly nested or partially overlapping"

  - id: V1.Exp3
    type: structural_and_operational_law
    title: "Faith, Hope, and Love as a Mutually Reinforcing Triad"
    core_text: >
      Faith (present trust) generates Hope (future expectation); Hope enables
      Love (freed from defensive self-protection); Love deepens Faith
      (creates the relational environment for trust to grow). The triad is
      self-reinforcing upward and self-degrading downward.
    status: core
    confidence: 80
    confidence_rationale: >
      Strong scriptural grounding across multiple texts. The directional
      arrows are the author's interpretation of the relational language; they
      need community testing and more rigorous diagram work.
    scripture_refs:
      - 1 Corinthians 13:13
      - Romans 5:3-5
      - "1 John 4:18 (see V1.Exp3.Mn1)"
    external_sources:
      - "Wayne Grudem, Systematic Theology"
    traditions_supporting: [Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.Ax3, V1.OE]
    downstream_dependents:
      - V2.TherapeuticSequence
    pt_period: P1
    pt_group: GII
    directionality: V
    band: null
    mirror_type: statement
    mirror_text: >
      Misplaced trust corrupts hope; corrupted hope deforms love; deformed
      love undermines further trust. Jer. 17:5-8 names both directions in a
      single oracle.
    minority_positions: [V1.Exp3.Mn1]
    open_questions:
      - "Specific direction of Hope → Love arrow is the most interpretive link"

  - id: V1.Exp3.Mn1
    type: minority_dissent
    parent_claim: V1.Exp3
    title: "Love → (removes fear) → faith-capacity, rather than Hope → Love"
    core_text: >
      The Hope → Love arrow may run in the opposite direction: perfect love
      casts out fear (1 John 4:18), suggesting that love itself is the agent
      that removes the defensive self-protection, rather than hope doing that
      work so that love can flow.
    status: minority
    traditions_supporting: [Reformed, some Charismatic]
    scripture_refs:
      - 1 John 4:18
    council_reply: >
      Both texts (Rom 5:3-5 and 1 John 4:18) are true. Grudem's reading holds
      that the triad is genuinely mutually reinforcing rather than strictly
      sequential; all three arrows operate simultaneously in a mature
      believer. The core position preserves the Rom 5 directional reading
      because it provides a therapeutic sequence (hope-work before
      love-practice) that has proven operational in community use. The
      minority is preserved because the directional question is not fully
      closed and may be revisited as testing accrues.
    flip_conditions: >
      Experiential evidence from therapeutic communities that a love-first
      sequence opens faith-capacity more reliably than a hope-first sequence
      would elevate this minority toward core status.

  - id: V1.Exp4
    type: structural_law
    title: "Knowledge → Understanding → Wisdom → Discernment"
    core_text: >
      Knowledge leads to Understanding, which leads to Wisdom, which leads to
      Discernment, with a feedback loop from Discernment back to Knowledge.
      The entire cluster requires the Fear of the Lord as a gateway
      condition. Without the Fear of the Lord, what looks like wisdom is
      merely cleverness.
    status: core
    confidence: 70
    confidence_rationale: >
      The directionality is the author's interpretation and needs more
      careful scriptural work, particularly the Understanding-Wisdom
      relationship. The Fear of the Lord as gateway carries higher confidence
      (see V1.Exp5).
    scripture_refs:
      - Proverbs 1:2
      - Proverbs 9:10
    traditions_supporting: [Reformed, Evangelical]
    upstream_dependencies: [V1.Ax1, V1.Exp5]
    downstream_dependents: []
    pt_period: P1
    pt_group: GIV
    directionality: I
    band: null
    mirror_type: statement
    mirror_text: >
      Without the gateway, the same faculties produce cleverness from a
      distorted reference point (Rom. 1:22; 1 Cor. 1:20).
    open_questions:
      - "Understanding → Wisdom directional relationship needs scriptural anchoring"

  - id: V1.Exp5
    type: gateway_law
    title: "The Fear of the Lord — Gateway Condition"
    core_text: >
      The Fear of the Lord is the logically prior condition for the operation
      of the Wisdom-Knowledge-Understanding-Discernment cluster. It functions
      as the epistemic ground reference — the fixed point from which all
      spiritual knowing can be accurately oriented. Without it, the cluster
      fails to orient correctly.
    status: core
    confidence: 85
    confidence_rationale: >
      Among the highest-confidence laws in the volume. Scriptural repetition
      is explicit and consistent across multiple wisdom texts. The mechanism
      (correct orientation of the self) is coherent with both scripture and
      experience.
    scripture_refs:
      - Proverbs 1:7
      - Proverbs 9:10
      - Isaiah 11:2-3
      - Psalm 111:10
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1]
    downstream_dependents:
      - V1.Exp4
      - V1.Exp6
      - V4.Researcher
    pt_period: P1
    pt_group: GI
    directionality: V
    band: null
    gateway: true
    mirror_type: statement
    mirror_text: >
      "Fools despise wisdom and instruction" (Prov. 1:7b). The orientation
      reading: fear of the Lord vs. fear of man (Prov. 29:25; Isa. 8:12-13).
    flip_conditions: >
      Would require demonstrating that the wisdom cluster operates reliably
      absent fear-of-the-Lord orientation. The author would flag this as a
      high-stakes revision affecting multiple downstream claims.

  - id: V1.Exp6
    type: operational_law
    title: "The Obedience Channel — How Revelation Flows"
    core_text: >
      Obedience to prior revelation is the causal condition for receiving
      subsequent revelation. The quality of the hearing channel in the
      Word → Hearing → Faith chain is modulated by obedience history.
      Obedience keeps the channel open and increases its gain; disobedience
      introduces a time-delayed hardening.
    status: core
    confidence: 85
    confidence_rationale: >
      High confidence. John 7:17 is explicit; the pattern is confirmed across
      multiple texts and in personal experience. The time-delay mechanism and
      its systems dynamics implications are still being worked out.
    scripture_refs:
      - John 7:17
      - John 14:21
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1, V1.Ax3, V1.Exp5]
    downstream_dependents:
      - V1.Exp1
      - V2.All
      - FL.XV   # wider law in the same family
    pt_period: P1
    pt_group: GV
    directionality: V
    band: null
    mirror_type: statement
    mirror_text: >
      Compounded disobedience progressively closes the channel (Heb. 3:13;
      1 Sam. 15:22-23). The FL.XV Hardening Law is the wider-scope law in
      the same family.
    open_questions:
      - "Time-delay mechanism between disobedience and hardening"
      - "Systems dynamics of channel degradation and recovery"

  - id: V1.Exp7
    type: operational_law
    title: "Spiritual Authority — The Force Multiplier"
    core_text: >
      Spiritual authority is delegated hierarchically from the Father through
      the Son to believers. Operating within properly delegated authority
      amplifies the effective spiritual force available — functioning as a
      force multiplier. Operating outside of that delegation exposes the
      would-be operator to counter-force with no cover.
    status: core
    confidence: 80
    confidence_rationale: >
      The centurion passage is unambiguous; the Acts 19 negative case is
      stark. The precise mechanics of 'operating within authority' in
      everyday spiritual life are still being worked out.
    scripture_refs:
      - Matthew 8:8-10
      - Matthew 28:18
      - Luke 10:19
      - Ephesians 1:20-22
      - Acts 19:13-16
    traditions_supporting: [Reformed, Evangelical, Charismatic]
    upstream_dependencies: [V1.Ax1, V1.OE]
    downstream_dependents:
      - V3.Eq1
      - FL.XIX   # generational-scale transmission of anointing/authority
    pt_period: P1
    pt_group: GV
    directionality: B
    band: null
    mirror_type: statement
    mirror_text: >
      The idol-ward face is usurped authority — Korah's rebellion (Num. 16)
      names the canonical biblical pattern.
    open_questions:
      - "How 'operating within delegated authority' is recognized in real time"

  - id: V1.Exp8
    type: operational_law
    title: "Prayer as a Resonance Phenomenon"
    core_text: >
      Prayer produces maximum spiritual force when three conditions align —
      direction (in harmony with God's will and character), timing (discerned
      spiritual readiness in the situation), and persistence (maintained over
      time as a waveform rather than a single pulse).
    status: core
    confidence: 70
    confidence_rationale: >
      The resonance analogy is compelling and consistent with multiple
      scripture patterns. The mustard seed model question (threshold vs.
      proportionality) is genuinely unresolved and materially affects the
      downstream equations. This claim needs the most community testing of
      any exploration in the volume.
    scripture_refs:
      - Luke 18:1
      - James 5:16
      - Matthew 17:20-21
    traditions_supporting: [Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1, V1.OE]
    downstream_dependents:
      - V3.Eq1
      - V3.Eq.Mustard
    pt_period: P2
    pt_group: GI
    directionality: V
    band: null
    mirror_type: statement
    mirror_text: >
      Prayer offered in the service of a competing Object does not produce
      resonance (Jas. 4:3). The Counter-Resonance Law at the same cell is
      the dyadic-scale operation of the same dynamic.
    open_questions:
      - "Threshold vs. proportionality dynamics (mustard seed question)"
      - "Whether the analogy is illustrative or load-bearing — author currently holds illustrative"
    council_flag: >
      Author has explicitly flagged this as needing the most community
      testing in the volume. Downstream Vol 3 equations materially depend on
      how the threshold/proportionality question resolves. A Council priority
      for early testing cycles.

# ===========================================================================
# Supplemental Exploration
# ===========================================================================

  - id: V1.Sup1
    type: structural_law
    title: "The Three Desires — Design Specifications of the Human Heart"
    core_text: >
      The masculine heart, made in the image of God, carries three
      design-level desires: a battle to fight, an adventure to live, and a
      beauty to rescue. These are not personality variables but structural
      features of image-bearing humanity.
    status: core
    confidence: null   # not explicitly rated in the source text
    external_sources:
      - "John Eldredge, Wild at Heart"
    traditions_supporting: [Evangelical, Charismatic]
    upstream_dependencies: [V1.Ax1, V1.Exp2]
    downstream_dependents:
      - V2.Eldredge
    pt_period: null
    pt_group: null
    directionality: null
    band: null
    mirror_type: null
    council_flag: >
      Supplemental, not part of the main Eight Explorations. The author has
      not assigned an explicit confidence rating. Council action needed: (a)
      decide whether to incorporate into the numbered set, (b) assign a
      confidence rating, or (c) reclassify as [O] open until the feminine-
      heart parallel (mentioned as future work) is developed.

# ===========================================================================
# Foundational Laws (FL.I-FL.XXXVIII)
# The 38 Foundational Laws of wide consent. Each entry encodes the canonical
# Proposed Law text, scriptural anchors, Periodic Table placement, Mirror
# Discipline field, and (where applicable) band-of-closeness designation.
# ===========================================================================

  - id: FL.I
    type: foundational_law
    title: "The Sowing-and-Reaping Law"
    core_text: >
      What a person, household, community, or generation sows, that unit
      reaps — in kind, in degree, and with characteristic time delay. The
      mechanism operates identically at every social scale (Period 0,
      Scale-Invariant in the Periodic Table) and runs bidirectionally:
      sowing toward life yields the harvest of life; sowing toward
      corruption yields the harvest of corruption. The time delay between
      sowing and harvest is the feature that most often obscures the
      causation in practice.
    status: core
    confidence: 90
    confidence_rationale: >
      As high as any law in this volume. Multi-author, multi-testament,
      broadly accepted across mainstream Christian tradition. Remaining
      uncertainty is in secondary specifications (what 'in kind' means at
      community and generational scales; characteristic time constants).
    scripture_refs:
      - Gal. 6:7-9
      - 2 Cor. 9:6
      - Hos. 8:7
      - Hos. 10:12
      - Prov. 22:8
      - Job 4:8
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    traditions_dissenting: []
    upstream_dependencies: [V1.Ax1, V1.OE]
    downstream_dependents: [FL.IX, FL.XVII, FL.XXVII]
    pt_period: P0
    pt_group: GVI
    directionality: B
    band: 1
    mirror_type: statement
    mirror_text: >
      Sowing to the Spirit (Gal. 6:8b) reaps eternal life; sowing to the
      flesh (Gal. 6:8a) reaps corruption. Same mechanism, two directions of
      pursuit, two characteristic outputs.

  - id: FL.II
    type: foundational_law
    title: "The Confession-Restoration Law"
    core_text: >
      Honest, owned confession of sin restores fellowship and clears the
      channel through which spiritual reality flows; concealment maintains
      the breach and accumulates an increasing somatic and spiritual load.
      The law operates vertically (Person to God, where it is logically
      prior) and horizontally (Person to community, where it is its applied
      form). It is the positive-direction complement to the existing Sin
      Blockage Law (V2.Exp4), and the two together form a complete account
      of the channel-opening / channel-blocking mechanism at the
      moral-failure level.
    status: core
    confidence: 90
    confidence_rationale: >
      As high as any law in this volume. Remaining uncertainty is
