  - id: FL.XXI
    type: foundational_law
    title: "The Household Formation Law"
    core_text: >
      Faithful covenant-keeping in one generation transmits blessing
      forward to subsequent generations through the structural transmission
      mechanisms of family, household formation, and covenant succession
      (Gen. 12:1-3; Gen. 17:7; Deut. 6:4-9; Deut. 7:9; 2 Tim. 1:5;
      Heb. 11:8-22). The inheriting generation receives both the operational
      benefits of the prior generation's faithfulness and the call to
      participate in the same covenant trajectory. The transmission operates
      asymmetrically with respect to its inverse (FL.XVII): the God-ward
      transmission requires deliberate teaching, sustained modeling, and
      explicit naming. The asymmetric-temporal-reach feature the second
      commandment names explicitly (Exod. 20:5-6's third-and-fourth-generation
      iniquity clause versus Deut. 7:9's thousand-generation steadfast-love
      clause) is the structural consequence of the asymmetric-deliberate-work
      requirement.
    status: core
