  - id: FL.XIX
    type: foundational_law
    title: "The Spirit Anointing Transmission Law"
    core_text: >
      The Spirit's anointing for ministry passes across generations through
      deliberate impartation and proximity-based formation, in such a way
      that the receiving generation operates with anointing of the same kind
      as the transmitting generation and arguably with increased magnitude
      where the operational conditions of impartation are properly observed
      (Num. 27:18-23; Deut. 34:9; 2 Kings 2:9-15; 2 Tim. 1:6; 2 Tim. 2:2).
      The transmission requires both the transmitting party's deliberate
      intent (the laying-on-of-hands as the operational form) and the
      receiving party's positioned readiness; the absence of either
      condition produces an outcome that bears the formal appearance of
      impartation without the operational substance. The transmission's
      magnitude depends on the receiving party's posture at the moment of
      impartation (Elisha's double-portion asking) and on the sustained
      development of the gift in the post-impartation period.
    status: core
    confidence: 90
    confidence_rationale: >
      Multi-author scriptural support is strong (four biblical authors
      across both Testaments, with three canonical case-studies operating
      as distinct demonstrations of the same structural pattern).
