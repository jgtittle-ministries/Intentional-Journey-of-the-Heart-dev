      name from the God-ward side. Same mechanism, two directions of
      pursuit.

  - id: FL.XVI
    type: foundational_law
    title: "The Bondage Law"
    core_text: >
      Sustained obedience to sin constitutes the obeyer as the slave of sin
      (Rom. 6:16; John 8:34); the obeyer becomes the slave of whatever the
      obeyer obeys, with the slavery growing in proportion to the duration
      and intensity of the obedience. The dynamic operates at the level of
      the action's intrinsic structure rather than at the level of
      accumulated consequence: to obey X is to be the slave of X by
      definition, not after. The mechanism applies wherever the dynamic
      operates — to sin in the theological sense, to addiction, to ideology,
      to fear, to any content whose sustained obedience can establish over
      the obedient (2 Pet. 2:19). The bondage is asymmetric with respect to
      its inverse: sustained refusal does not by itself establish freedom;
      freedom from a master to whom one has been enslaved requires
      deliverance, transferred obedience to another master, or both.
      Scale-invariant.
    status: core
    confidence: 90
    confidence_rationale: >
      Multi-author scriptural support is strong (four biblical authors
      across both Testaments, with the most direct statement at Rom. 6:16
      carrying explicit categorical-disjunction form).
    scripture_refs:
      - Rom. 6:16
      - Rom. 6:19-22
      - John 8:34
      - 2 Pet. 2:19
      - Prov. 5:22
      - Heb. 12:1
      - Titus 3:3
    traditions_supporting: [Reformed, Evangelical, Charismatic, Mystical]
    upstream_dependencies: [V1.Ax1, FL.VI, FL.XV]
