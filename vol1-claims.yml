  - id: FL.V
    type: foundational_law
    title: "The Reciprocal Forgiveness Law"
    core_text: >
      The forgiveness a person extends to others is the channel through
      which forgiveness from God flows to that person; withholding
      forgiveness reinstates the debt structure that forgiveness had
      dissolved. The law operates by the same mechanism at the vertical
      (Person—God) and horizontal (Person—Person) scales. Bidirectional in
      the source texts: the positive and negative directions are stated
      together, not derived one from the other.
    status: core
