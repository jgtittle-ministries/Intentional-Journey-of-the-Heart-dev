      spiritually mature members of the community, conducted in a spirit of
      gentleness and with attentiveness to the pursuer's own susceptibility,
      restores the erring participant to communion and saves the participant
      from the trajectory the wandering had set; the disposition (gentleness
      and joy-in-restoration) is constitutive of the law's mechanism, and
      the watchfulness on the pursuer's own susceptibility is the law's
      structural recognition that the pursuer is herself within the same
      operational substrate as the wanderer.
