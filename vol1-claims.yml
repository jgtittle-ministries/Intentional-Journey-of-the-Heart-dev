  - id: FL.XIII
    type: foundational_law
    title: "The Pure-Heart Vision Law"
    core_text: >
      Purity of heart — single-mindedness, undivided love for God, freedom
      from cherished sin, ongoing self-purification — is the prior condition
      for the seeing of God, in both the present-perception and
      eschatological-vision senses. Impurity blocks the seeing entirely, not
      partially. The law has a gateway structure parallel to Fear of the
      Lord (V1.Exp5): the seeing follows the purity, not the other way
      around.
    status: core
    confidence: 90
    confidence_rationale: >
      Strong multi-author multi-Testament base. The seeing of God has both
      a present-perception dimension (Matt. 5:8; Ps. 24) and an
      eschatological-vision dimension (1 John 3:2-3; Heb. 12:14).
    scripture_refs:
      - Matt. 5:8
      - Heb. 12:14
      - Ps. 24:3-4
