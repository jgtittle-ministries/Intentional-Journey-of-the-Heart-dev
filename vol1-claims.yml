  - id: FL.XX
    type: foundational_law
    title: "The Gathered-Body Discernment Law"
    core_text: >
      The Holy Spirit speaks distinctively through a gathered body operating
      in unity, sustained seeking, and openness to correction, in such a
      way that the discernment available to the gathered body exceeds what
      is available to any individual member alone. The gathered-body
      discernment operates as a distinct mode of the Spirit's address, with
      its own conditions (unity, sustained seeking, openness to correction),
      its own characteristic outputs (corporate decision, prophetic clarity,
      joined commission, binding-and-loosing authority), and its own
      mechanism (the Spirit's address through the body in its gathered
      character, with the discernment not reducible to the aggregation of
      individual discernments). The promise of Christ's presence in the
      gathered body (Matt. 18:20) names the mechanism.
    status: core
    confidence: 90
    confidence_rationale: >
