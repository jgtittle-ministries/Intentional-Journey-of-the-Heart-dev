  - id: FL.XXXV
    type: foundational_law
    title: "The Trust-Substrate Law"
    core_text: >
      The heart's experienced trust in God's reliable character and faithful
      presence operates as the substrate condition under which the
      operations of obedience, perseverance, intercession, sacrifice, and
      difficulty-bearing become structurally available in their God-ward
      form; absent the trust-substrate, the same scriptural address is
      received but the operations substitute either performance-as-obedience
      (the anxious-approach pattern) or self-protection-as-prudence (the
      avoidant pattern), with the substitution operationally observable in
      the action's fruit. The substrate operates scale-invariantly across
      individual, dyadic, community, generational, and cosmic-eschatological
      scales by the same mechanism, with the substrate's formation occurring
      through sustained covenant practice oriented toward the heart's
      experienced participation in God's disclosed character.
    status: core
    confidence: 90
    confidence_rationale: >
      Eight-or-more-biblical-author cross-Testament support (Solomon;
      Isaiah; the Psalmists; Jeremiah; Habakkuk; the Gospel writers; Paul;
      the Hebrews writer; Peter; John) with operational depth across wisdom,
      prophetic, narrative, gospel, apostolic, and Petrine-Johannine
      registers.
