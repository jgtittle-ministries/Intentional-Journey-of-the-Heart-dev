  - id: FL.IV
    type: foundational_law
    title: "The Humility-Exaltation Law"
    core_text: >
      Self-humbling before God leads to being exalted by God in due time;
      self-exaltation leads to being brought low. The law is bidirectional
      in the source texts, not derived in one direction from the other. It
      operates vertically (Person to God, where the time-delay clause
      applies) and reflects horizontally in human honor dynamics. The
      mechanism is structural rather than transactional: God dwells with the
      humble (Isa. 57:15), so humility is the condition for proximity, and
      pride is the condition for distance.
    status: core
    confidence: 90
