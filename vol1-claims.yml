  - id: FL.XXXVIII
    type: foundational_law
    title: "The Soul-Restoration Law"
    core_text: >
      The soul — under the pressures of life and the operations of the
      world that operate against soul-integration — is restored to and
      maintained in its integrated state through God's sustained restorative
      operation on the soul, with the restoration operating through multiple
      operational forms God names (the Shepherd's restoring; Christ's giving
      of rest; the anchor of hope behind the curtain; the Shepherd-and-
      Overseer's return-of-the-straying; the God of peace's sanctifying; the
      steadfast-love-and-mercies that are new every morning; the law of the
      LORD's reviving; the renewing of strength for those who wait; the
      inner-self-being-renewed day by day; the peace of Christ ruling; the
      priestly blessing's giving of peace) and through multiple operational
      pathways the soul engages (sustained scripture-engagement; sustained
      prayer; sustained worship; sustained community; sustained rest;
      suffering received under God's hand). Scale-invariant.
    status: core
