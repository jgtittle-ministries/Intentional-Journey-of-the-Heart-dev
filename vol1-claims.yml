  - id: FL.VII
    type: foundational_law
    title: "The Drawing-Near Reciprocity Law"
    core_text: >
      Active movement toward God (seeking, drawing near, searching with
      whole heart) evokes God's movement toward the person (being found,
      being drawn near to); turning away evokes withdrawal. The reciprocity
      is symmetric in direction, asymmetric in source: God is the prior
      actor, and the human seeking is itself a response to a prior divine
      invitation. The law operates at the vertical scale and is the clearest
      scriptural example of reciprocity-of-response.
    status: core
    confidence: 90
    confidence_rationale: >
      As high as any law in this volume. Remaining uncertainty is in the
