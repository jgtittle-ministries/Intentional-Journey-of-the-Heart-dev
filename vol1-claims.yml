  - id: FL.XXXIII
    type: foundational_law
    title: "The Community Polity Structure / Ecclesial Architecture Law"
    core_text: >
      Some polity-structure — the leader-follower-and-peer arrangements, the
      offices and their qualifications, the decision-making patterns, the
      institutional-continuity arrangements that hold the community across
      time — operates as the architectural framework within which the
      gathered community's other operations are conducted; the framework is
      Christ-given (the offices established by Christ for the body's
      building-up), operates for operational purpose (the equipping of the
      saints for ministry; the body's maturation), and operates within
      eschatological horizon (the church's continued formation toward the
      measure of the stature of the fullness of Christ); the specific form
      the structure takes — episcopal, presbyterian, congregational,
      charismatic-led, gathered-church, or some hybrid arrangement — is the
      territory of tradition-by-tradition theological work and not
      catalog-arbitrated articulation.
    status: core
