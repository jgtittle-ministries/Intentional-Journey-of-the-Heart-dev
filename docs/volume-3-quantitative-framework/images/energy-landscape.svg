<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The spiritual energy landscape</title>
<desc>A potential-energy curve: souls rest in a shallow local minimum behind an activation barrier (the mustard-seed threshold); the Glory attractor is the deep well to the right. Revival is the Spirit (G) supplying energy that lifts the room over the barrier, after which potential becomes kinetic and the soul gains momentum toward God.</desc>
<defs><marker id="ahb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#5b6573"/></marker></defs>
<rect x="1.5" y="1.5" width="677" height="407" rx="14" fill="#faf9f5" stroke="#e6e1d6" stroke-width="1.5"/>
<text x="340" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#233044">The spiritual energy landscape</text>
<text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#5b6573">why one outpouring can lift a whole room out of its local minimum</text>
<text x="66" y="86" font-size="13.5" font-weight="600" fill="#233044">G — the Spirit supplies the energy</text>
<text x="66" y="104" font-size="12" fill="#5b6573">received, not generated · no mechanism, a Father</text>
<rect x="430" y="74" width="12" height="12" rx="2" fill="#c2740a"/><text x="448" y="84" font-size="12" fill="#5b6573">held in the local minimum</text>
<rect x="430" y="95" width="12" height="12" rx="2" fill="#0e8a7d"/><text x="448" y="105" font-size="12" fill="#5b6573">moving toward Glory</text>
<line x1="66" y1="122" x2="66" y2="360" stroke="#c9c5ba" stroke-width="1"/>
<text x="70" y="120" font-size="12" fill="#8a8678">↑ potential energy</text>
<line x1="66" y1="360" x2="634" y2="360" stroke="#c9c5ba" stroke-width="1"/>
<text x="350" y="382" text-anchor="middle" font-size="12" fill="#8a8678">spiritual distance → (nearer to God to the right)</text>
<path d="M80 140 C120 235 150 250 185 250 C240 250 295 188 330 152 C365 178 460 330 520 332 C566 333 600 300 628 262" fill="none" stroke="#233044" stroke-width="2.5"/>
<line x1="330" y1="152" x2="330" y2="250" stroke="#5b6573" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="324" y1="152" x2="336" y2="152" stroke="#5b6573" stroke-width="1.5"/>
<line x1="324" y1="250" x2="336" y2="250" stroke="#5b6573" stroke-width="1.5"/>
<text x="340" y="206" font-size="12" fill="#5b6573">Eₐ — mustard-seed threshold</text>
<path d="M215 240 C260 248 300 200 330 152 C345 165 358 172 372 186" fill="none" stroke="#5b6573" stroke-width="2.5" marker-end="url(#ahb)"/>
<text x="292" y="136" text-anchor="middle" font-size="12" fill="#5b6573">revival</text>
<circle cx="160" cy="244" r="6" fill="#c2740a"/><circle cx="185" cy="240" r="9" fill="#c2740a"/><circle cx="210" cy="244" r="6" fill="#c2740a"/>
<circle cx="330" cy="142" r="7" fill="#c2740a"/>
<circle cx="432" cy="256" r="7" fill="#0e8a7d"/><circle cx="480" cy="300" r="7" fill="#0e8a7d"/>
<line x1="180" y1="284" x2="185" y2="258" stroke="#c9c5ba" stroke-width="1"/>
<text x="180" y="296" text-anchor="middle" font-size="12" fill="#5b6573">local minimum</text>
<text x="455" y="240" text-anchor="middle" font-size="12" fill="#5b6573">gaining momentum</text>
<line x1="540" y1="292" x2="522" y2="330" stroke="#c9c5ba" stroke-width="1"/>
<text x="552" y="286" text-anchor="middle" font-size="12" fill="#5b6573">the Glory attractor</text>
</svg>
