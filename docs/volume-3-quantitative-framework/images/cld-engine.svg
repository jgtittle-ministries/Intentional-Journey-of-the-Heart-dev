<svg viewBox="0 0 800 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">The Faith–Obedience engine as a causal loop diagram</title>
<desc id="d">A reinforcing loop — Word of Christ to Hearing to Faith/Trust to Obedience to Revelation and back to Word, every link positive. A time delay sits on the Obedience-to-Revelation link. God's free self-giving (G) feeds the loop from outside as an exogenous input. The heart's throne (FL.III) is the master switch: God enthroned spins the loop virtuous; an idol enthroned reverses the same loop into the Hardening/Bondage spiral.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9851F"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E7C8E"/></marker>
</defs>
<rect x="3" y="3" width="794" height="606" rx="14" fill="#FBFAF7" stroke="#E7E2D9" stroke-width="1.5"/>
<text x="400" y="32" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="20" font-weight="600">The Faith–Obedience Engine</text>

<g fill="none" stroke="#C9851F" stroke-width="2.4">
  <path d="M 441,148 A 150 150 0 0 1 524,208" marker-end="url(#ag)"/>
  <path d="M 550,287 A 150 150 0 0 1 518,384" marker-end="url(#ag)"/>
  <path d="M 451,433 A 150 150 0 0 1 349,433" marker-end="url(#ag)"/>
  <path d="M 282,384 A 150 150 0 0 1 250,287" marker-end="url(#ag)" stroke-dasharray="9 5"/>
  <path d="M 276,208 A 150 150 0 0 1 359,148" marker-end="url(#ag)"/>
</g>

<g fill="#C9851F" font-family="Georgia, serif" font-size="16" font-weight="700" text-anchor="middle">
  <text x="500" y="153">+</text><text x="568" y="342">+</text><text x="400" y="468">+</text><text x="232" y="342">+</text><text x="300" y="153">+</text>
</g>

<text x="236" y="394" text-anchor="middle" fill="#6E7C8E" font-family="Georgia, serif" font-size="15" font-weight="700">‖</text>
<text x="212" y="410" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">delay (weeks)</text>

<circle cx="400" cy="292" r="34" fill="none" stroke="#C9851F" stroke-width="2"/>
<path d="M 400,258 A 34 34 0 1 1 372,274" fill="none" stroke="#C9851F" stroke-width="2" marker-end="url(#ag)"/>
<text x="400" y="290" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="20" font-weight="700">R</text>
<text x="400" y="307" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="9">reinforcing</text>

<g font-family="Georgia, serif" font-size="12.5" text-anchor="middle">
  <rect x="338" y="124" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="400" y="145" fill="#2B2E34">Word of Christ</text>
  <rect x="481" y="229" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="543" y="250" fill="#2B2E34">Hearing</text>
  <rect x="426" y="396" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="488" y="417" fill="#2B2E34">Faith / Trust</text>
  <rect x="250" y="396" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="312" y="417" fill="#2B2E34">Obedience</text>
  <rect x="195" y="229" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="257" y="250" fill="#2B2E34">Revelation</text>
</g>
<text x="612" y="248" fill="#6B7280" font-family="Georgia, serif" font-size="10" text-anchor="start">V1.Exp1</text>
<text x="312" y="449" fill="#6B7280" font-family="Georgia, serif" font-size="10" text-anchor="middle">V1.Exp6 · FL.VI</text>

<rect x="24" y="92" width="216" height="56" rx="9" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.4"/>
<text x="34" y="114" fill="#2B2E34" font-family="Georgia, serif" font-size="12" font-weight="600">G — God's free self-giving</text>
<text x="34" y="132" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">exogenous · the Hand (miracle / dark night)</text>
<path d="M 168,148 C 190,180 210,205 245,234" fill="none" stroke="#6E7C8E" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#as)"/>

<rect x="150" y="522" width="500" height="62" rx="9" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.4"/>
<text x="400" y="542" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="12.5" font-weight="600">Heart's throne (FL.III) — the master switch</text>
<text x="400" y="560" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">God enthroned → the loop runs virtuous;</text>
<text x="400" y="575" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">an idol enthroned → it reverses into the Hardening / Bondage spiral (FL.XV–XVI)</text>
<path d="M 400,522 C 400,470 400,420 400,328" fill="none" stroke="#6E7C8E" stroke-width="1.8" marker-end="url(#as)"/>

<g font-family="Georgia, serif" font-size="10" fill="#6B7280">
  <text x="628" y="38">+ same-direction link</text>
  <text x="628" y="53">R reinforcing · ‖ delay</text>
</g>
</svg>
