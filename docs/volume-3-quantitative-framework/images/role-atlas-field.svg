<svg viewBox="0 0 900 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Where each Foundational Law lives in the transcendental field</title>
<desc id="dsc">A potential-energy landscape on the Truth-Goodness-Beauty configuration space: a hardening well is a trap that mustard-seed trust escapes; the Glory attractor (FL.XXXVI) is the deep basin all trajectories tend toward; a dashed holiness boundary bounds the set-apart region; and below, FL.XLI flips that boundary from a wall that repels into an attractor that draws and cleanses.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9851F"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7C8E"/></marker>
</defs>

<rect x="3" y="3" width="894" height="662" rx="14" fill="#FBFAF7" stroke="#E7E2D9" stroke-width="1.5"/>

