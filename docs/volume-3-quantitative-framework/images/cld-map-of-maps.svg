  <rect x="525" y="409" width="200" height="72" rx="9" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.4"/>
  <text x="625" y="430" text-anchor="middle" fill="#2B2E34" font-size="11.5" font-weight="600">Generational loops</text>
  <text x="625" y="447" text-anchor="middle" fill="#6B7280" font-size="9.5">Household ⇄ Cascade</text>
  <text x="625" y="462" text-anchor="middle" fill="#6B7280" font-size="9.5">Calcification · Transmission</text>
</g>

<!-- Word-Stewardship loop (cross-layer, newly drawn) -->
<rect x="85" y="300" width="210" height="72" rx="9" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.6"/>
<text x="190" y="321" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="11.5" font-weight="600">Word-Stewardship loop (R)</text>
<text x="190" y="338" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="9.5">cross-layer: interior ↔ horizontal</text>
<text x="190" y="353" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="9.5">image → speak → align → weighed</text>
<text x="190" y="367" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="9">FL.XLVIII·II·XXIV·XLVII·XX·XLVI</text>

<!-- macro trajectory to Glory -->
<line x1="500" y1="330" x2="812" y2="330" stroke="#C9851F" stroke-width="2.6" marker-end="url(#ag)"/>
<text x="656" y="320" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="11">the macro-trajectory</text>
<text x="656" y="350" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">suffering = swing-input (FL.XXII)</text>
<circle cx="858" cy="330" r="33" fill="#C9851F" fill-opacity="0.13"/>
<circle cx="858" cy="330" r="17" fill="#C9851F" fill-opacity="0.18"/>
<circle cx="858" cy="330" r="7" fill="#C9851F"/>
<text x="858" y="385" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="11.5" font-weight="600">Glory attractor</text>
<text x="858" y="400" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">FL.XXXVI</text>

<!-- throne switch -->
<rect x="175" y="600" width="470" height="42" rx="9" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.4"/>
<text x="410" y="626" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="12" font-weight="600">Heart's throne (FL.III) — master switch: sets every loop's sign</text>
<path d="M 410,600 C 410,500 410,420 410,366" fill="none" stroke="#6E7C8E" stroke-width="1.8" marker-end="url(#as)"/>

<!-- legend -->
<g font-family="Georgia, serif" font-size="9.5" fill="#6B7280">
  <text x="752" y="612">⇄ couples to engine</text>
  <text x="752" y="626">R reinforcing · B balancing</text>
  <text x="752" y="640">dashed = exogenous (G) · ‖ delay</text>
