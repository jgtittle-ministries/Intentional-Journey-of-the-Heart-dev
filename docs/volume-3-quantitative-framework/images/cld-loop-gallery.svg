<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">A gallery of four representative causal loops</title>
<desc id="d">Four shapes from the set. Top-left: Drawing-Near reciprocity, a bipolar reinforcing loop. Top-right: the Knot-Bandwidth balancing trap, broken only by an external input. Bottom-left: Community Amplification, a reinforcing loop with an error-amplification shadow. Bottom-right: the generational Household-Formation loop, with a long delay and a Substitution-Cascade shadow.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9851F"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E7C8E"/></marker>
</defs>
<rect x="3" y="3" width="914" height="634" rx="14" fill="#FBFAF7" stroke="#E7E2D9" stroke-width="1.5"/>
<text x="460" y="30" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="19" font-weight="600">Four Shapes from the Set</text>
<line x1="460" y1="52" x2="460" y2="620" stroke="#E7E2D9" stroke-width="1.2"/>
<line x1="30" y1="338" x2="890" y2="338" stroke="#E7E2D9" stroke-width="1.2"/>

<!-- ================= Q1: Drawing-Near (bipolar R) ================= -->
<text x="240" y="78" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="13" font-weight="600">Drawing-Near — bipolar (R)</text>
<g font-family="Georgia, serif" font-size="11.5" text-anchor="middle">
  <rect x="72" y="172" width="120" height="32" rx="16" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="132" y="192" fill="#2B2E34">I draw near</text>
  <rect x="286" y="172" width="132" height="32" rx="16" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="352" y="192" fill="#2B2E34">God draws near</text>
</g>
<path d="M 196,178 C 230,150 258,150 282,176" fill="none" stroke="#C9851F" stroke-width="2.2" marker-end="url(#ag)"/>
<path d="M 282,200 C 250,226 224,226 196,202" fill="none" stroke="#C9851F" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="238" y="150" text-anchor="middle" fill="#C9851F" font-size="14" font-weight="700">+</text>
<text x="238" y="232" text-anchor="middle" fill="#C9851F" font-size="14" font-weight="700">+</text>
<text x="238" y="193" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="12" font-weight="700">R</text>
<text x="240" y="262" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">flip the throne → Hardening (R−)</text>
<text x="240" y="290" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">FL.VII (shadow: FL.XV)</text>

<!-- ================= Q2: Knot-Bandwidth trap (B) ================= -->
<text x="690" y="78" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="13" font-weight="600">Knot-Bandwidth — a trap (B)</text>
<g font-family="Georgia, serif" font-size="11" text-anchor="middle">
  <rect x="632" y="120" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.5"/><text x="691" y="139" fill="#2B2E34">Emotional knot</text>
  <rect x="724" y="198" width="98" height="30" rx="15" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.5"/><text x="773" y="217" fill="#2B2E34">Bandwidth ↓</text>
  <rect x="566" y="198" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#6E7C8E" stroke-width="1.5"/><text x="612" y="217" fill="#2B2E34">Hearing ↓</text>
</g>
<g fill="none" stroke="#6E7C8E" stroke-width="2">
  <path d="M 736,150 C 760,165 768,180 772,196" marker-end="url(#as)"/>
  <path d="M 724,213 C 700,213 685,213 660,213" marker-end="url(#as)"/>
  <path d="M 622,198 C 632,178 642,165 658,151" marker-end="url(#as)"/>
</g>
<text x="691" y="187" text-anchor="middle" fill="#6E7C8E" font-family="Georgia, serif" font-size="12" font-weight="700">B</text>
<path d="M 500,176 C 525,190 540,200 560,210" fill="none" stroke="#C9851F" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<text x="505" y="166" text-anchor="start" fill="#C9851F" font-family="Georgia, serif" font-size="10">Spirit's truth — external input</text>
<text x="690" y="262" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">only an outside input breaks the trap</text>
<text x="690" y="290" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">Vol 2 · Exp 2–3</text>

<!-- ================= Q3: Community Amplification (R) ================= -->
<text x="240" y="378" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="13" font-weight="600">Community Amplification (R)</text>
<g font-family="Georgia, serif" font-size="10.5" text-anchor="middle">
  <rect x="168" y="404" width="146" height="30" rx="15" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="241" y="423" fill="#2B2E34">Individual brings</text>
  <rect x="276" y="486" width="122" height="30" rx="15" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="337" y="505" fill="#2B2E34">Body confirms</text>
  <rect x="86" y="486" width="138" height="30" rx="15" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="155" y="505" fill="#2B2E34">Collective faith ↑</text>
</g>
<g fill="none" stroke="#C9851F" stroke-width="2">
  <path d="M 280,434 C 305,452 318,465 330,484" marker-end="url(#ag)"/>
  <path d="M 276,501 C 252,501 238,501 226,501" marker-end="url(#ag)"/>
  <path d="M 150,486 C 162,460 178,448 198,434" marker-end="url(#ag)"/>
</g>
<text x="238" y="466" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="12" font-weight="700">R</text>
<text x="240" y="548" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">closed loop → amplifies error</text>
<text x="240" y="576" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">FL.XX / XXXI · Vol 2 Exp 9</text>

<!-- ================= Q4: Household generational (R, delay) ================= -->
<text x="690" y="378" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="13" font-weight="600">Household — generational (R, ‖)</text>
<g font-family="Georgia, serif" font-size="10.5" text-anchor="middle">
  <rect x="500" y="430" width="118" height="32" rx="9" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="559" y="450" fill="#2B2E34">Parent's heart</text>
  <rect x="632" y="430" width="118" height="32" rx="9" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="691" y="450" fill="#2B2E34">Children formed</text>
  <rect x="764" y="430" width="118" height="32" rx="9" fill="#FFFFFF" stroke="#C9851F" stroke-width="1.5"/><text x="823" y="450" fill="#2B2E34">Next generation</text>
</g>
<g fill="none" stroke="#C9851F" stroke-width="2">
  <path d="M 620,446 L 628,446" marker-end="url(#ag)"/>
  <path d="M 752,446 L 760,446" marker-end="url(#ag)"/>
  <path d="M 823,462 C 823,500 559,500 559,464" marker-end="url(#ag)"/>
</g>
<text x="624" y="440" text-anchor="middle" fill="#6E7C8E" font-size="12" font-weight="700">‖</text>
<text x="756" y="440" text-anchor="middle" fill="#6E7C8E" font-size="12" font-weight="700">‖</text>
<text x="691" y="494" text-anchor="middle" fill="#C9851F" font-family="Georgia, serif" font-size="11" font-weight="700">R (generations)</text>
<text x="690" y="556" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10.5">idol-ward → Substitution-Cascade (FL.XVII)</text>
<text x="690" y="578" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="10">FL.XXI · ‖ = multi-year delay</text>
</svg>
