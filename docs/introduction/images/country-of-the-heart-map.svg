<path d="M340 106 L340 123" fill="none" stroke="#C9851F" stroke-width="2" marker-end="url(#ara)"/>
<path d="M480 106 L480 123" fill="none" stroke="#C9851F" stroke-width="2" marker-end="url(#ara)"/>

<rect x="70" y="128" width="540" height="258" rx="14" fill="#E9F0E2" stroke="#C7DAB4" stroke-width="1.5"/>

<path d="M232 184 A42 42 0 1 1 202 264" fill="none" stroke="#2E6FA8" stroke-width="3" marker-end="url(#arb)"/>
<text x="232" y="228" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="14" font-weight="600">The Engine</text>
<text x="232" y="172" text-anchor="middle" fill="#3A3A3A" font-family="Georgia, serif" font-size="12">hear</text>
<text x="290" y="226" text-anchor="middle" fill="#3A3A3A" font-family="Georgia, serif" font-size="12">trust</text>
<text x="230" y="281" text-anchor="middle" fill="#3A3A3A" font-family="Georgia, serif" font-size="12">obey</text>

<path d="M278 236 Q394 256 470 304" fill="none" stroke="#2E6FA8" stroke-width="3" marker-end="url(#arb)"/>
<text x="402" y="250" text-anchor="middle" fill="#3A3A3A" font-family="Georgia, serif" font-size="12">toward Home</text>

<circle cx="524" cy="306" r="44" fill="#F2D9A6" stroke="#C9851F" stroke-width="2"/>
<text x="524" y="302" text-anchor="middle" fill="#6E4E12" font-family="Georgia, serif" font-size="14" font-weight="600">HOME</text>
<text x="524" y="320" text-anchor="middle" fill="#6E4E12" font-family="Georgia, serif" font-size="11.5">like Christ</text>

<ellipse cx="150" cy="332" rx="48" ry="25" fill="#E4E2DD" stroke="#B7B3AB" stroke-width="1.5"/>
