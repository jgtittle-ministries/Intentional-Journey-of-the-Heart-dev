<rect x="70" y="398" width="540" height="104" rx="8" fill="#F4F2EC" stroke="#E0DCD2" stroke-width="1.2"/>
<text x="88" y="421" fill="#2B2E34" font-family="Georgia, serif" font-size="13" font-weight="600">Four ways to read this one map</text>
<text x="88" y="443" fill="#4A4A4A" font-family="Georgia, serif" font-size="11.5">1 · the grid  →  WHERE a law lives (its address)</text>
<text x="88" y="461" fill="#4A4A4A" font-family="Georgia, serif" font-size="11.5">2 · hills &amp; pits  →  its SHAPE (does it help, or trap?)</text>
<text x="88" y="479" fill="#4A4A4A" font-family="Georgia, serif" font-size="11.5">3 · the arrows  →  HOW the laws move together</text>
<text x="88" y="497" fill="#4A4A4A" font-family="Georgia, serif" font-size="11.5">4 · the colour  →  WHAT KIND of law it is</text>
</svg>
