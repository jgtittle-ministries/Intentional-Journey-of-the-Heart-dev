<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The Country of the Heart — the whole book on one map</title>
<desc id="dsc">One map of how the spiritual laws connect. Grace rains down from outside the map as the Father's free gift. A central engine — hear, trust, obey, and again — carries the heart toward Home, becoming like Christ. Two example laws are marked as places to visit: Sowing-and-Reaping and Confession. Some places are pits, like Hardening, that trap and need help from outside. A legend gives four ways to read the map: the grid says where a law lives, the terrain says its shape, the arrows say how the laws move together, and the colour says what kind of law it is.</desc>
<defs>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6FA8"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9851F"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
</defs>

<rect x="3" y="3" width="674" height="514" rx="14" fill="#FBFAF7" stroke="#E7E2D9" stroke-width="1.5"/>

<text x="340" y="34" text-anchor="middle" fill="#2B2E34" font-family="Georgia, serif" font-size="22" font-weight="600">The Country of the Heart</text>
<text x="340" y="55" text-anchor="middle" fill="#6B7280" font-family="Georgia, serif" font-size="12.5">the whole book on one map — how a heart grows toward God</text>

<rect x="70" y="70" width="540" height="34" rx="8" fill="#F5E6C8" stroke="#DCC08A" stroke-width="1.2"/>
<text x="340" y="92" text-anchor="middle" fill="#7A5A18" font-family="Georgia, serif" font-size="13" font-weight="600">GRACE — the Father gives, from outside the map</text>
